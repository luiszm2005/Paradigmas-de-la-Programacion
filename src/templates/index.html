<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</head>
<body>
    <h1 class="text-center mt-5 nb-5 text-primary">Python-Flask-MySQL</h1>
    <div class="container">
        <div class="card shadow">
            <div class="card-body">
                <form action="/alumno" method="POST"> <!-- Cambiado a /alumno -->
                    <div class="row mb-3">
                        <div class="col">
                            <label>Nombre</label> <!-- Cambiado a Nombre -->
                            <input type="text" class="form-control mb3" name="nombre" required>
                        </div>

                        <div class="col">
                            <label>Edad</label> <!-- Cambiado a Edad -->
                            <input type="number" class="form-control mb3" name="edad" required>
                        </div>

                        <div class="col">
                            <label>Dirección</label> <!-- Cambiado a Dirección -->
                            <input type="text" class="form-control mb3" name="direccion" required>
                        </div>

                        <div class="col">
                            <button class="btn btn-primary mb-3 mt-4" type="submit">Guardar</button> <!-- Cambiado a "Guardar" -->
                        </div>
                    </div>
                </form>

                <!-- Tabla -->
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Nombre</th> <!-- Cambiado a Nombre -->
                            <th scope="col">Edad</th> <!-- Cambiado a Edad -->
                            <th scope="col">Dirección</th> <!-- Cambiado a Dirección -->
                            <th scope="col">Editar</th> <!-- Cambiado a Editar -->
                            <th scope="col">Eliminar</th> <!-- Cambiado a Eliminar -->
                        </tr>
                    </thead>
                    <tbody>
                        {% for d in data %}
                            <tr>
                                <td>{{d.Alumno_ID}}</td> <!-- Cambiado a Alumno_ID -->
                                <td>{{d.Nombre}}</td> <!-- Cambiado a Nombre -->
                                <td>{{d.Edad}}</td> <!-- Cambiado a Edad -->
                                <td>{{d.Direccion}}</td> <!-- Cambiado a Dirección -->
                                <td>
                                    <button class="btn btn-primary btn-sm" id="btn-edit{{d.Alumno_ID}}" data-bs-toggle="modal" data-bs-target="#modal{{d.Alumno_ID}}">Editar</button>
                                </td>
                                <td><a href="{{url_for('delete', id=d.Alumno_ID)}}" class="btn btn-danger btn-sm">Eliminar</a></td> <!-- Cambiado a Alumno_ID -->
                            </tr>
                            <!-- Ventana modal -->
                            <div class="modal fade" id="modal{{d.Alumno_ID}}" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true"> <!-- Cambiado a Alumno_ID -->
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h1 class="modal-title fs-5" id="exampleModalLabel">{{d.Nombre}}</h1> <!-- Cambiado a Nombre -->
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            <form action="/edit/{{d.Alumno_ID}}" method="post"> <!-- Cambiado a Alumno_ID -->
                                                <label>Nombre</label> <!-- Cambiado a Nombre -->
                                                <input type="text" class="form-control mb3" name="nombre" value="{{d.Nombre}}" required> <!-- Cambiado a Nombre -->
                                                <label>Edad</label> <!-- Cambiado a Edad -->
                                                <input type="number" class="form-control mb3" name="edad" value="{{d.Edad}}" required> <!-- Cambiado a Edad -->
                                                <label>Dirección</label> <!-- Cambiado a Dirección -->
                                                <input type="text" class="form-control mb3" name="direccion" value="{{d.Direccion}}" required> <!-- Cambiado a Dirección -->
                                        </div>
                                        <div class="modal-footer">
                                            <button type="submit" class="btn btn-primary">Guardar cambios</button> <!-- Cambiado a "Guardar cambios" -->
                                        </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
